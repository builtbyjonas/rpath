name: Documentation Issue
description: Report missing, confusing, or incorrect docs.
title: "docs: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: README.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should change?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
